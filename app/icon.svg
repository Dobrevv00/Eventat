    <rect x="18" y="17" width="28" height="7" rx="2"/>
    <rect x="18" y="28.5" width="21" height="7" rx="2"/>
    <rect x="18" y="40" width="28" height="7" rx="2"/>
    <rect x="18" y="17" width="7" height="30" rx="2"/>
  </g>
</svg>
